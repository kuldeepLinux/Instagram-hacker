<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insta Hack Pro</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', monospace; }
  body {
    background: #000;
    color: #0f0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  .container {
    width: 90%;
    max-width: 600px;
    background: #0a0a0a;
    border: 2px solid #0f0;
    border-radius: 10px;
    padding: 25px;
    box-shadow: 0 0 30px #0f0, inset 0 0 20px rgba(0,255,0,0.1);
  }
  h1 {
    text-align: center;
    color: #0f0;
    font-size: 22px;
    margin-bottom: 5px;
    text-shadow: 0 0 10px #0f0;
  }
  .subtitle {
    text-align: center;
    color: #080;
    font-size: 12px;
    margin-bottom: 20px;
  }
  .input-group {
    margin-bottom: 15px;
  }
  label {
    display: block;
    color: #0f0;
    font-size: 13px;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 12px;
    background: #000;
    border: 1px solid #0f0;
    color: #0f0;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    border-radius: 5px;
    outline: none;
  }
  input:focus {
    box-shadow: 0 0 10px #0f0;
  }
  button {
    width: 100%;
    padding: 14px;
    background: #0f0;
    color: #000;
    border: none;
    font-size: 16px;
    font-weight: bold;
    font-family: 'Courier New', monospace;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 10px;
    letter-spacing: 2px;
    transition: 0.3s;
  }
  button:hover {
    background: #000;
    color: #0f0;
    box-shadow: 0 0 20px #0f0;
    border: 1px solid #0f0;
  }
  button:disabled {
    background: #333;
    color: #666;
    cursor: not-allowed;
  }

  /* Terminal screen */
  #terminal {
    display: none;
    background: #000;
    border: 1px solid #0f0;
    border-radius: 5px;
    padding: 15px;
    height: 320px;
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.6;
    margin-top: 15px;
  }
  #terminal::-webkit-scrollbar { width: 6px; }
  #terminal::-webkit-scrollbar-thumb { background: #0f0; }

  .log { margin-bottom: 4px; }
  .log.ok { color: #0f0; }
  .log.warn { color: #ff0; }
  .log.err { color: #f00; }
  .log.info { color: #0af; }

  .progress-wrap {
    display: none;
    margin-top: 15px;
  }
  .progress-bar {
    width: 100%;
    height: 22px;
    background: #111;
    border: 1px solid #0f0;
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #0f0, #0f8);
    transition: width 0.3s;
    box-shadow: 0 0 10px #0f0;
  }
  .progress-text {
    text-align: center;
    color: #0f0;
    font-size: 13px;
    margin-top: 5px;
  }

  /* Reveal screen */
  #reveal {
    display: none;
    text-align: center;
    animation: pop 0.5s ease;
  }
  @keyframes pop {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  #reveal h2 {
    font-size: 60px;
    margin-bottom: 20px;
  }
  #reveal h3 {
    color: #ff0;
    font-size: 28px;
    margin-bottom: 15px;
    text-shadow: 0 0 15px #ff0;
  }
  #reveal p {
    color: #0f0;
    font-size: 15px;
    line-height: 1.8;
    margin-bottom: 10px;
  }
  .reset-btn {
    background: #ff0;
    color: #000;
    margin-top: 20px;
  }
  .reset-btn:hover {
    background: #000;
    color: #ff0;
    border-color: #ff0;
    box-shadow: 0 0 20px #ff0;
  }

  .blink { animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div class="container">
  <!-- INPUT SCREEN -->
  <div id="inputScreen">
    <h1>⚡ INSTA HACK PRO v4.2 ⚡</h1>
    <p class="subtitle">[ Advanced Instagram Password Recovery Tool ]</p>

    <div class="input-group">
      <label>🎯 Target Username:</label>
      <input type="text" id="username" placeholder="e.g. john_doe" autocomplete="off">
    </div>

    <button id="startBtn">▶ START HACKING</button>
  </div>

  <!-- TERMINAL SCREEN -->
  <div id="terminal"></div>

  <!-- PROGRESS -->
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-text" id="progressText">0%</div>
  </div>

  <!-- REVEAL SCREEN -->
  <div id="reveal">
    <h2>😂</h2>
    <h3>PRANKED!</h3>
    <p>Kuch bhi hack nahi hua bhai 😄</p>
    <p>Yeh sirf ek fake UI tha jo mazaak ke liye banaya gaya hai.</p>
    <p>Tumhari Instagram ID bilkul safe hai. Ab chill karo!</p>
    <button class="reset-btn" onclick="location.reload()">🔄 Dobara Chalao</button>
  </div>
</div>

<script>
  const inputScreen = document.getElementById('inputScreen');
  const terminal = document.getElementById('terminal');
  const progressWrap = document.getElementById('progressWrap');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  const reveal = document.getElementById('reveal');
  const startBtn = document.getElementById('startBtn');
  const usernameInput = document.getElementById('username');

  const fakeLogs = [
    { text: "> Initializing Insta Hack Pro...", type: "info", delay: 400 },
    { text: "> Loading exploit modules...", type: "info", delay: 600 },
    { text: "> Connecting to Instagram servers...", type: "info", delay: 800 },
    { text: "> IP: 157.240.22.174  [Meta Platforms]", type: "warn", delay: 600 },
    { text: "> Bypassing SSL encryption...", type: "info", delay: 700 },
    { text: "✔ SSL Bypassed", type: "ok", delay: 500 },
    { text: "> Injecting SQL payload...", type: "info", delay: 900 },
    { text: "✔ Database entry found", type: "ok", delay: 500 },
    { text: "> Cracking password hash (bcrypt)...", type: "warn", delay: 1200 },
    { text: "> Trying common passwords...", type: "info", delay: 700 },
    { text: "  ├─ 123456 ......... ✗", type: "err", delay: 300 },
    { text: "  ├─ password ....... ✗", type: "err", delay: 300 },
    { text: "  ├─ qwerty ......... ✗", type: "err", delay: 300 },
    { text: "  ├─ iloveyou ....... ✗", type: "err", delay: 300 },
    { text: "  └─ insta2024 ...... ✔", type: "ok", delay: 400 },
    { text: "✔ Password decrypted successfully", type: "ok", delay: 700 },
    { text: "> Accessing profile data...", type: "info", delay: 800 },
    { text: "✔ Followers list downloaded", type: "ok", delay: 500 },
    { text: "✔ DM history extracted", type: "ok", delay: 500 },
    { text: "✔ Login token generated", type: "ok", delay: 600 },
    { text: "> ⚠ WARNING: Account access granted", type: "warn", delay: 800 },
  ];

  function addLog(text, type) {
    const div = document.createElement('div');
    div.className = 'log ' + (type || 'info');
    div.textContent = text;
    terminal.appendChild(div);
    terminal.scrollTop = terminal.scrollHeight;
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  async function runHack() {
    const username = usernameInput.value.trim() || "target_user";

    inputScreen.style.display = 'none';
    terminal.style.display = 'block';
    progressWrap.style.display = 'block';

    addLog(`> Target: @${username}`, "warn");
    await sleep(800);

    let progress = 0;
    const totalSteps = fakeLogs.length;

    for (let i = 0; i < fakeLogs.length; i++) {
      const log = fakeLogs[i];
      addLog(log.text, log.type);
      await sleep(log.delay);

      progress = Math.floor(((i + 1) / totalSteps) * 100);
      progressFill.style.width = progress + '%';
      progressText.textContent = progress + '%';
    }

    await sleep(1000);
    addLog("> Finalizing...", "info");
    await sleep(800);
    addLog("✔ ACCESS GRANTED", "ok");

    await sleep(1200);

    // Reveal
    terminal.style.display = 'none';
    progressWrap.style.display = 'none';
    reveal.style.display = 'block';
  }

  startBtn.addEventListener('click', runHack);
  usernameInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') runHack();
  });
</script>
</body>
</html>
